; LiberNT RDP console server configuration. With enabled=0 the server follows
; the Remote Desktop settings (fDenyTSConnections). A private test configuration
; (RDPSERVER_CONFIG_DIR) sets enabled=1 together with a bind address, the one
; allowed controller address, credentials and a TLS certificate/key pair.
; See README.md next to rdpserver.c.

[server]
enabled=0
