name: Build
on:
  push:
    branches: [master]
  pull_request:
  # Saves the pull request configuration's ccache on the default branch, the only cache a new pull request can restore
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - compiler: gcc
            arch: i386
          - compiler: clang
            arch: amd64
          - compiler: clang
            arch: arm64
            profile: profile_raspberry
          - compiler: clang
            arch: riscv64
            profile: profile_spacemit_k1
          - compiler: clang
            arch: ppc
      fail-fast: false
    runs-on: ubuntu-24.04
    env:
      BUILD_TYPE: ${{ github.event_name == 'push' && 'release' || 'debug' }}
      CCACHE_KEY: ccache-${{ github.event_name == 'push' && 'release-' || '' }}${{matrix.compiler}}-${{matrix.arch}}${{matrix.variant}}-
      CCACHE_SEED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium
        sudo docker system prune --all --force
        df -h /

    - name: Source checkout
      uses: actions/checkout@v6

    - name: Install host build tools
      run: |
        # Every Ubuntu mirror can answer 503 for a minute or more; the whole install is retried after a pause.
        for attempt in 1 2 3 4; do
          if sudo apt-get update && sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar python3-mako python3-yaml python3-packaging glslang-tools msitools; then
            break
          fi
          if [ "$attempt" -eq 4 ]; then
            exit 1
          fi
          sleep $((30 * attempt))
        done

    - name: Compute RosBE bootstrap SHA
      id: rosbe_spec
      run: |
        curl -fsSL https://raw.githubusercontent.com/LiberNT/libernt-build-toolchain/main/rosbe-unix-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
        echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Restore RosBE
      id: cache_rosbe
      uses: actions/cache/restore@v5
      with:
        path: ~/.local/opt/rosbe
        key: rosbe-${{runner.os}}-${{steps.rosbe_spec.outputs.sha}}

    - name: Install RosBE
      if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
      run: sh /tmp/rosbe-bootstrap.sh

    # Pull requests only restore: their caches filled the 10 GB store and evicted those of master
    - name: Save RosBE
      if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' && github.event_name != 'pull_request' }}
      uses: actions/cache/save@v5
      with:
        path: ~/.local/opt/rosbe
        key: rosbe-${{runner.os}}-${{steps.rosbe_spec.outputs.sha}}

    - name: Restore ccache
      id: ccache_restore
      uses: actions/cache/restore@v5
      with:
        path: ccache
        key: ${{env.CCACHE_KEY}}${{github.run_id}}-${{github.run_attempt}}
        restore-keys: |
          ${{env.CCACHE_KEY}}

    - name: Set ccache settings
      run: |
        echo "CCACHE_BASEDIR=${{github.workspace}}" >> $GITHUB_ENV
        echo "CCACHE_DIR=${{github.workspace}}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV
        # The statistics printed after the build are this run's alone
        CCACHE_DIR=${{github.workspace}}/ccache ccache -z

    - name: Configure
      id: configure
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        FLAGS=""
        [ "$BUILD_TYPE" = "release" ] && FLAGS="$FLAGS --release"
        [ "${{matrix.compiler}}" = "clang" ] && FLAGS="$FLAGS --clang"
        [ "${{matrix.compiler}}" = "gcc" ] && FLAGS="$FLAGS --gcc"
        [ -n "${{matrix.profile}}" ] && FLAGS="$FLAGS -DROSCONFIG_PROFILE=${{matrix.profile}}"
        [ "${{matrix.compiler}}" = "clang" ] && case "${{matrix.arch}}" in amd64|arm64|riscv64) FLAGS="$FLAGS -DENABLE_MESA_LLVMPIPE=ON" ;; esac
        ./configure.sh $FLAGS -a ${{matrix.arch}} \
          -DREACTOS_TARGET_NT=0xA00 \
          -DENABLE_CCACHE=1
        ENV_NAME=$([ "${{matrix.compiler}}" = "clang" ] && echo Clang || echo GCC)
        echo "outdir=output-$ENV_NAME-${{matrix.arch}}-$BUILD_TYPE" >> "$GITHUB_OUTPUT"

    - name: Build submodules
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} submodules

    - name: Build images
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        TARGETS=bootcd
        [ "$BUILD_TYPE" = "debug" ] && TARGETS="$TARGETS liberntimg liberntvhd"
        ninja -C ${{steps.configure.outputs.outdir}} $TARGETS -k0

    - name: Print ccache statistics
      if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
      run: ccache -s

    # A cancelled build holds a partial cache: saving it would make it the newest and prune the full one
    - name: Save ccache
      id: ccache_save
      if: ${{ !cancelled() && steps.ccache_restore.outcome == 'success' && github.event_name != 'pull_request' }}
      uses: actions/cache/save@v5
      with:
        path: ccache
        key: ${{ steps.ccache_restore.outputs.cache-primary-key }}

    - name: Prune older ccache entries
      if: ${{ !cancelled() && steps.ccache_save.outcome == 'success' }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_KEY_PREFIX: ${{env.CCACHE_KEY}}
        CACHE_KEY_KEEP: ${{ steps.ccache_restore.outputs.cache-primary-key }}
      run: |
        gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CACHE_KEY_PREFIX" --limit 100 --json id,key \
          --jq '.[] | select(.key != env.CACHE_KEY_KEEP) | .id' |
        while read -r id; do
          gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
        done

    - name: Name artifacts
      id: images
      run: |
        [ "$BUILD_TYPE" = "release" ] && TYPE=-release || TYPE=
        echo "tag=${{matrix.compiler}}-${{matrix.arch}}${{matrix.variant}}$TYPE-${GITHUB_SHA::11}" >> "$GITHUB_OUTPUT"

    - name: Name bootcd.iso
      run: |
        ISO=${{steps.configure.outputs.outdir}}/bootcd.iso
        if [ -f "$ISO" ]; then ln -f "$ISO" "${{steps.configure.outputs.outdir}}/bootcd-${{steps.images.outputs.tag}}.iso"; fi

    - name: Upload bootcd.iso
      if: ${{ env.CCACHE_SEED != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        path: ${{steps.configure.outputs.outdir}}/bootcd-${{steps.images.outputs.tag}}.iso
        archive: false

    - name: Upload LiberNT.img
      if: ${{ env.BUILD_TYPE == 'debug' && env.CCACHE_SEED != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: LiberNT-img-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/LiberNT.img

    - name: Upload LiberNT.vhd
      if: ${{ env.BUILD_TYPE == 'debug' && env.CCACHE_SEED != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: LiberNT-vhd-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/LiberNT.vhd

    - name: Upload LiberNT.vhdx
      if: ${{ env.BUILD_TYPE == 'debug' && env.CCACHE_SEED != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: LiberNT-vhdx-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/LiberNT.vhdx

    - name: Check build dependencies
      run: python3 sdk/tools/depcheck.py ${{steps.configure.outputs.outdir}} --mode depfiles --nested --fail-on-gaps

  build-msvc:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    strategy:
      matrix:
        arch: [amd64, i386, arm64]
      fail-fast: false
    runs-on: windows-2025
    steps:
    - name: Source checkout
      uses: actions/checkout@v6

    - name: Install host build tools
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # GitHub throttles anonymous release downloads from runners; gh downloads with the job token.
        $zip = "$env:RUNNER_TEMP\win_flex_bison-2.5.24.zip"
        foreach ($attempt in 1..4) {
            gh release download v2.5.24 --repo lexxmark/winflexbison --pattern win_flex_bison-2.5.24.zip --output $zip --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { throw "Downloading winflexbison failed" }
            Start-Sleep -Seconds (15 * $attempt)
        }
        if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "39C6086CE211D5415500ACC5ED2D8939861CA1696AEE48909C7F6DAF5122B505") {
            throw "win_flex_bison-2.5.24.zip does not have the expected SHA256"
        }
        $tools = "$env:RUNNER_TEMP\winflexbison"
        Expand-Archive $zip -DestinationPath $tools -Force
        python -m pip install --upgrade mako pyyaml packaging
        # LiberNT's CMake looks for flex/bison; winflexbison ships them as
        # win_flex/win_bison, so expose both names on PATH.
        Copy-Item "$tools\win_flex.exe" "$tools\flex.exe" -Force
        Copy-Item "$tools\win_bison.exe" "$tools\bison.exe" -Force
        echo "$tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Set up the MSVC build environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch == 'i386' && 'amd64_x86' || matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

    - name: Configure
      id: configure
      shell: cmd
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        call configure.cmd /arch=${{matrix.arch}} -DREACTOS_TARGET_NT=0xA00 -DENABLE_CCACHE=0
        echo outdir=output-VS-${{matrix.arch}}-debug>> "%GITHUB_OUTPUT%"

    - name: Build submodules
      shell: cmd
      run: ninja -C ${{steps.configure.outputs.outdir}} submodules

    - name: Build
      shell: cmd
      run: ninja -C ${{steps.configure.outputs.outdir}} -k0
