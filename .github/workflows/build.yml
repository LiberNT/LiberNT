name: Build
on: [push, pull_request]

permissions:
  contents: read
  actions: write

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - compiler: gcc
            arch: i386
            config: Debug
            ntver: '0xA00'
          - compiler: gcc
            arch: amd64
            config: Debug
            ntver: '0xA00'
          - compiler: clang
            arch: amd64
            config: Debug
            ntver: '0xA00'
          - compiler: clang
            arch: arm64
            config: Debug
            ntver: '0xA00'
            profile: profile_raspberry
          - compiler: clang
            arch: riscv64
            config: Debug
            ntver: '0xA00'
            profile: profile_spacemit_k1
          - compiler: clang
            arch: riscv64
            config: Debug
            ntver: '0xA00'
            profile: profile_starfive_jh7110
            variant: jh7110
          - compiler: clang
            arch: ppc
            config: Debug
            ntver: '0xA00'
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium
        sudo docker system prune --all --force
        df -h /

    - name: Source checkout
      uses: actions/checkout@v6

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar python3-mako python3-yaml python3-packaging glslang-tools msitools

    - name: Compute RosBE bootstrap SHA
      id: rosbe_spec
      run: |
        curl -fsSL https://raw.githubusercontent.com/LiberNT/libernt-build-toolchain/main/rosbe-unix-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
        echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Cache RosBE
      id: cache_rosbe
      uses: actions/cache@v5
      with:
        path: ~/.local/opt/rosbe
        key: rosbe-${{runner.os}}-${{steps.rosbe_spec.outputs.sha}}

    - name: Install RosBE
      if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
      run: sh /tmp/rosbe-bootstrap.sh

    - name: Restore ccache
      id: ccache_restore
      uses: actions/cache/restore@v5
      with:
        path: ccache
        key: ccache-${{matrix.compiler}}-${{matrix.arch}}${{matrix.variant}}-${{matrix.config}}-${{matrix.ntver}}-${{github.run_id}}-${{github.run_attempt}}
        restore-keys: |
          ccache-${{matrix.compiler}}-${{matrix.arch}}${{matrix.variant}}-${{matrix.config}}-${{matrix.ntver}}-

    - name: Set ccache settings
      run: |
        echo "CCACHE_BASEDIR=${{github.workspace}}" >> $GITHUB_ENV
        echo "CCACHE_DIR=${{github.workspace}}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV

    - name: Configure
      id: configure
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        FLAGS=""
        [ "${{matrix.compiler}}" = "clang" ] && FLAGS="$FLAGS --clang"
        [ "${{matrix.compiler}}" = "gcc" ] && FLAGS="$FLAGS --gcc"
        [ "${{matrix.config}}" = "Release" ] && FLAGS="$FLAGS -r"
        [ -n "${{matrix.profile}}" ] && FLAGS="$FLAGS -DROSCONFIG_PROFILE=${{matrix.profile}}"
        [ "${{matrix.compiler}}" = "clang" ] && case "${{matrix.arch}}" in amd64|arm64) FLAGS="$FLAGS -DENABLE_MESA_LLVMPIPE=ON" ;; esac
        ./configure.sh $FLAGS -a ${{matrix.arch}} \
          -DREACTOS_TARGET_NT=${{matrix.ntver}} \
          -DDIAGDATA_CHANNEL= \
          -DENABLE_CCACHE=1
        ENV_NAME=$([ "${{matrix.compiler}}" = "clang" ] && echo Clang || echo GCC)
        CFG_LOWER=$(echo "${{matrix.config}}" | tr '[:upper:]' '[:lower:]')
        echo "outdir=output-$ENV_NAME-${{matrix.arch}}-$CFG_LOWER" >> "$GITHUB_OUTPUT"

    - name: Build submodules
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} submodules

    - name: Build images
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} bootcd liberntimg liberntvhd -k0

    - name: Print ccache statistics
      if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
      run: ccache -s

    - name: Save ccache
      id: ccache_save
      if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
      uses: actions/cache/save@v5
      with:
        path: ccache
        key: ${{ steps.ccache_restore.outputs.cache-primary-key }}

    - name: Prune older ccache entries
      if: ${{ always() && steps.ccache_save.outcome == 'success' }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_KEY_PREFIX: ccache-${{matrix.compiler}}-${{matrix.arch}}${{matrix.variant}}-${{matrix.config}}-${{matrix.ntver}}-
        CACHE_KEY_KEEP: ${{ steps.ccache_restore.outputs.cache-primary-key }}
      run: |
        gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CACHE_KEY_PREFIX" --limit 100 --json id,key \
          --jq '.[] | select(.key != env.CACHE_KEY_KEEP) | .id' |
        while read -r id; do
          gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
        done

    - name: Name artifacts
      id: images
      run: echo "tag=${{matrix.compiler}}-${{matrix.arch}}${{matrix.variant}}-${{matrix.config}}-target${{matrix.ntver}}-${GITHUB_SHA::11}" >> "$GITHUB_OUTPUT"

    - name: Upload bootcd.iso
      uses: actions/upload-artifact@v7
      with:
        name: bootcd-iso-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/bootcd.iso

    - name: Upload LiberNT.img
      uses: actions/upload-artifact@v7
      with:
        name: LiberNT-img-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/LiberNT.img

    - name: Upload LiberNT.vhd
      uses: actions/upload-artifact@v7
      with:
        name: LiberNT-vhd-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/LiberNT.vhd

    - name: Check build dependencies
      run: python3 sdk/tools/depcheck.py ${{steps.configure.outputs.outdir}} --mode depfiles --nested --fail-on-gaps
