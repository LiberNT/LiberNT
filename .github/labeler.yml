# Labelling by the files touched

ATL:
- changed-files:
  - any-glob-to-any-file:
    - sdk/lib/atl/**

drivers:
- changed-files:
  - any-glob-to-any-file:
    - drivers/**
    - sdk/lib/drivers/**
  - all-globs-to-any-file:
    - subsystems/win/win32k/drivers/**
    - '!subsystems/win/win32k/drivers/font/**'

freeldr:
- changed-files:
  - any-glob-to-any-file:
    - boot/freeldr/**

"kernel&hal":
- changed-files:
  - any-glob-to-any-file:
    - hal/**
    - ntos/**

ROSTESTS:
- changed-files:
  - any-glob-to-any-file:
    - modules/rostests/**

shell:
- changed-files:
  - any-glob-to-any-file:
    - base/shell/explorer/**
    - base/shell/rshell/**
    - dll/shellext/**
    - dll/win32/browseui/**
    - dll/win32/shell32/**

Win32SS:
- changed-files:
  - any-glob-to-any-file:
    - subsystems/win/win32k/**

"input method":
- changed-files:
  - any-glob-to-any-file:
    - base/ctf/**
    - base/system/conime/**
    - subsystems/win/win32k/user/imm32/**
    - subsystems/win/win32k/user/ntuser/ime.c
    - subsystems/win/win32k/user/user32/misc/imm.c
